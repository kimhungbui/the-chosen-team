[project]
name = "the-chosen-team"
version = "0.1.0"
description = "Multi-agent framework setup using Agno"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno>=3.0.0",
    "google-genai>=2.0.0",
    "duckduckgo-search>=8.0.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
