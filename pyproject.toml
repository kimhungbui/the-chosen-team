[project]
name = "the-chosen-team"
version = "0.1.0"
description = "Multi-agent framework setup using Agno"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno>=3.0.0",
    "google-genai>=2.0.0",
    "duckduckgo-search>=8.0.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "pymupdf>=1.23.0",
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
